<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黑洞引力透镜 · Three.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #app { position: fixed; inset: 0; }
    #hud {
      position: fixed;
      left: 16px;
      top: 14px;
      color: rgba(255, 230, 200, 0.85);
      font: 12px/1.8 "PingFang SC", "Microsoft YaHei", sans-serif;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
    #hud a { color: #ffb45e; text-decoration: none; pointer-events: auto; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #d8b98a;
      font: 15px/1 "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 4px;
      z-index: 20;
      transition: opacity 0.8s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">正 在 穿 越 事 件 视 界 …</div>
  <div id="hud">黑洞引力透镜 · 拖拽旋转 · 滚轮缩放 ｜ <a href="/">← 鱼缸场景</a></div>
  <script>
    window.__errs = [];
    window.addEventListener('error', (e) => {
      window.__errs.push((e.message || 'error') + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
    });
  </script>
  <script type="module" src="/src/blackhole/main.js"></script>
</body>
</html>
