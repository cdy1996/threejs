<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鱼缸海洋微缩场景 · Three.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f3840; }
    #app { position: fixed; inset: 0; }
    #hud {
      position: fixed;
      left: 16px;
      bottom: 14px;
      color: rgba(230, 250, 250, 0.85);
      font: 12px/1.6 "PingFang SC", "Microsoft YaHei", sans-serif;
      text-shadow: 0 1px 2px rgba(0, 30, 40, 0.6);
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f3840;
      color: #bfe8e4;
      font: 15px/1 "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 4px;
      z-index: 20;
      transition: opacity 0.8s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">正 在 潜 入 海 洋 …</div>
  <div id="hud">拖拽旋转 · 滚轮缩放 · 右键平移</div>
  <script>
    window.__errs = [];
    window.addEventListener('error', (e) => {
      window.__errs.push((e.message || 'error') + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
      const hud = document.getElementById('hud');
      if (hud) hud.textContent = 'ERROR: ' + window.__errs.join(' | ');
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
