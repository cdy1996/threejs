<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>水缸微景观 · Mini Aquarium</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 35%, #14606a 0%, #0c4048 45%, #062a30 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  #scene-container { position: fixed; inset: 0; }
  #scene-container canvas { display: block; }
  .title {
    position: fixed; top: 26px; left: 32px; z-index: 2; pointer-events: none;
    color: #d8f4ef; letter-spacing: 4px;
  }
  .title h1 { font-size: 22px; font-weight: 600; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
  .title p { margin-top: 6px; font-size: 12px; color: #9fd0c9; letter-spacing: 2px; }
  .hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2;
    color: rgba(216, 244, 239, .55); font-size: 12px; letter-spacing: 2px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="scene-container"></div>
<div class="title">
  <h1>水缸微景观</h1>
  <p>MINI AQUARIUM · THREE.JS</p>
</div>
<div class="hint">拖动旋转 · 滚轮缩放</div>
<script type="module" src="/src/tank/main.js"></script>
</body>
</html>
