<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>
WebRTC P2P Lab
</title>


<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>


<style>

body{
    font-family:
    Arial;
    padding:20px;
    background:#f5f5f5;
}


.card{

    background:white;

    border-radius:10px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:
    0 2px 8px #ccc;

}


textarea{

    width:100%;

    height:150px;

}


input{

    padding:8px;

}


button{

    padding:8px 15px;

    margin:5px;

    cursor:pointer;

}


video{

    width:320px;

    background:black;

}


#log{

    height:200px;

    overflow:auto;

    background:#111;

    color:#0f0;

    padding:10px;

}


</style>


</head>


<body>


<h1>
浏览器 P2P 协作实验室
</h1>


<div class="card">

<h2>
1. WebRTC DataChannel
</h2>


<button onclick="createOffer()">
生成 Offer
</button>


<button onclick="createAnswer()">
生成 Answer
</button>


<button onclick="applyAnswer()">
应用 Answer
</button>


<h3>
SDP交换
</h3>


<textarea id="sdp"></textarea>



<br>


<input id="message"
placeholder="消息">


<button onclick="sendMessage()">
发送
</button>


<br>


<input type="file"
id="fileInput">


<button onclick="sendFile()">
发送文件
</button>


</div>




<div class="card">


<h2>
2. 摄像头
</h2>


<button onclick="openCamera()">
打开摄像头
</button>


<br>


<video
id="cameraVideo"
autoplay
playsinline>
</video>


</div>





<div class="card">


<h2>
3. 屏幕共享
</h2>


<button onclick="shareScreen()">
共享屏幕
</button>


<br>


<video
id="screenVideo"
autoplay
playsinline>
</video>


</div>






<div class="card">


<h2>
4. PeerJS P2P
</h2>


<button onclick="createPeer()">
创建ID
</button>


<p id="myPeer"></p>


<input id="peerId"
placeholder="对方ID">


<button onclick="connectPeer()">
连接
</button>



<br>


<input id="peerMessage">


<button onclick="sendPeer()">
发送
</button>


</div>







<div class="card">


<h2>
5. Yjs实时协作
</h2>


<input
id="room"
value="demo-room">


<button onclick="joinRoom()">
加入房间
</button>


<br>


<textarea id="editor"></textarea>


</div>






<div class="card">


<h2>
日志
</h2>


<div id="log"></div>


</div>




<script>


function log(msg){

let div=document.getElementById("log");

div.innerHTML+=msg+"<br>";

div.scrollTop=div.scrollHeight;

}


</script>


<script type="module" src="./main.js"></script>


</body>

</html>
