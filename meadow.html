<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>草原木屋 · Meadow & Cabin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1108; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; }
  #scene-container { position: fixed; inset: 0; }
  #scene-container canvas { display: block; }

  .title {
    position: fixed; top: 26px; left: 32px; z-index: 2; pointer-events: none;
    color: #f2f6ea; letter-spacing: 4px;
  }
  .title h1 { font-size: 22px; font-weight: 600; text-shadow: 0 2px 14px rgba(20,30,10,.75); }
  .title p { margin-top: 6px; font-size: 12px; color: #c3d2b4; letter-spacing: 2px; }

  #stat {
    position: fixed; top: 30px; right: 30px; z-index: 2; pointer-events: none;
    font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
    color: #dfe8d4; text-shadow: 0 1px 4px rgba(0,0,0,.8);
    background: rgba(18, 24, 12, .38);
    border: 1px solid rgba(200, 220, 180, .16);
    border-radius: 6px; padding: 6px 10px;
    backdrop-filter: blur(4px);
  }

  .hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 2;
    color: rgba(238, 246, 228, .72); font-size: 12px; letter-spacing: 1.5px;
    pointer-events: none; text-align: center; line-height: 1.8;
    text-shadow: 0 1px 6px rgba(0,0,0,.8);
  }
  .hint a { color: #ffe6a8; text-decoration: none; pointer-events: auto; }

  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #0d1108; color: #cfe0b8;
    font-size: 15px; letter-spacing: 6px;
    transition: opacity .9s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }

  .lil-gui { --background-color: rgba(20, 26, 14, .86); --title-background-color: rgba(38, 48, 24, .92); }
</style>
</head>
<body>
<div id="scene-container"></div>
<div class="title">
  <h1>草 原 木 屋</h1>
  <p>MEADOW &amp; LOG CABIN · PROCEDURAL THREE.JS</p>
</div>
<div id="stat">初始化中…</div>
<div class="hint">
  拖拽旋转 · 滚轮缩放 · 右键平移 · H 键收起面板 ｜
  <a href="/index.html">→ 鱼缸</a> ·
  <a href="/blackhole.html">黑洞</a> ·
  <a href="/ocean.html">海面</a> ·
  <a href="/fire.html">火焰</a>
</div>
<div id="loading">正 在 生 长 草 地 …</div>

<script>
  window.__errs = [];
  window.addEventListener('error', (e) => {
    window.__errs.push((e.message || 'error') + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
    const stat = document.getElementById('stat');
    if (stat) { stat.style.color = '#ff9a9a'; stat.textContent = 'ERROR: ' + window.__errs.join(' | '); }
  });
</script>
<script type="module" src="/src/meadow/main.js"></script>
<script>
  setTimeout(() => document.getElementById('loading').classList.add('hide'), 900);
</script>
</body>
</html>
